# 生产部署编排：app + nginx + 全部中间件
# 使用：先准备 .env（参考 .env.example），再执行
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: freshtrace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: freshtrace
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: freshtrace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      args:
        ES_VERSION: 8.13.4
    image: freshtrace-elasticsearch:8.13.4
    container_name: freshtrace-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  namesrv:
    image: apache/rocketmq:5.3.0
    container_name: freshtrace-namesrv
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
      TZ: Asia/Shanghai
    command: sh mqnamesrv

  broker:
    image: apache/rocketmq:5.3.0
    container_name: freshtrace-broker
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes:
      - ./docker/rocketmq/broker-prod.conf:/home/rocketmq/conf/broker.conf
    depends_on:
      - namesrv

  app:
    build:
      context: .
    image: freshtrace-app:1.1
    container_name: freshtrace-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_NAME_SERVER: namesrv:9876
      ELASTICSEARCH_ENABLED: "true"
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AES_KEY: ${AES_KEY:?AES_KEY is required}
    volumes:
      - app-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      namesrv:
        condition: service_started
      broker:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: freshtrace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql-data:
  redis-data:
  es-data:
  app-logs:
